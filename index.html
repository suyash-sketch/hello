<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello Jii</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="click-hint" id="clickHint">

            <p class="hint-text">click me at the heart...</p>
        </div>
        <div class="envelope-wrapper" id="envelopeWrapper">
            <div class="envelope">
                <div class="envelope-back"></div>
                <div class="envelope-flap">
                    <div class="heart-button" id="heartButton" aria-label="Open envelope">
                        <span class="heart">🩷</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="apology-card hidden" id="apologyCard">
            <h1>Hellooo Jii 🤓🤓 </h1>
            <button class="close-btn" id="closeBtn">✕</button>
        </div>
    </div>

    <script>
        const heartButton = document.getElementById('heartButton');
        const envelopeWrapper = document.getElementById('envelopeWrapper');
        const apologyCard = document.getElementById('apologyCard');
        const closeBtn = document.getElementById('closeBtn');

        const clickHint = document.getElementById('clickHint');

        heartButton.addEventListener('click', function() {
            envelopeWrapper.classList.add('open');
            clickHint.classList.add('fade-out');
            setTimeout(function() {
                apologyCard.classList.remove('hidden');
            }, 350);
        });

        closeBtn.addEventListener('click', function() {
            envelopeWrapper.classList.remove('open');
            apologyCard.classList.add('hidden');
            clickHint.classList.remove('fade-out');
        });
    </script>
</body>
</html>
